# =========================================================================
# POLARIS - Render blueprint (backend API)
#
#   Render dashboard -> New -> Blueprint -> point at this repository.
#
# PostgreSQL is hosted on Neon, not Render: Render's free databases are
# deleted 30 days after creation, Neon's free tier does not expire. Set
# DATABASE_URL below to the Neon connection string.
#
# The frontend deploys separately on Vercel (see frontend/vercel.json); only
# CORS_ORIGINS below has to be updated once its URL is known.
# =========================================================================

services:
  - type: web
    name: polaris-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # $PORT is injected by Render.
    #
    # bootstrap is idempotent: on the FIRST boot it backfills ~90 days of real
    # ERA5 history and runs the AI pipeline once, so the dashboard has data
    # immediately. On every later restart - including a free-tier wake from
    # sleep - it finds the history already present and skips in milliseconds.
    # `|| true` means a transient provider outage degrades to a slower first
    # load rather than a boot loop.
    startCommand: >-
      python -m scripts.init_db &&
      (python -m scripts.bootstrap --days 90 || true) &&
      uvicorn app.main:app --host 0.0.0.0 --port $PORT
      --proxy-headers --forwarded-allow-ips='*'
    # /api/ping never touches the database. Render probes every few seconds;
    # probing /api/health would keep a scale-to-zero database awake 24/7.
    healthCheckPath: /api/ping
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: ENABLE_DOCS
        value: "true"
      # ==> SET THIS to the Neon connection string (Dashboard -> Connect).
      #     Use the DIRECT host, not the "-pooler" one, and keep
      #     ?sslmode=require. It is a secret: set it in the Render dashboard,
      #     never in this file.
      - key: DATABASE_URL
        sync: false
      # ==> SET THIS to the deployed Vercel origin after the frontend is up.
      #     In production there is no localhost wildcard, so an unset value
      #     means the browser will be refused by CORS.
      - key: CORS_ORIGINS
        sync: false
      - key: ALLOW_NETWORK_INGEST
        value: "true"
      - key: HISTORY_DAYS
        value: "120"
      - key: FORECAST_HORIZON_H
        value: "168"
      - key: WEATHER_TIMEOUT_S
        value: "25"
      - key: REFRESH_INTERVAL_S
        value: "1800"
