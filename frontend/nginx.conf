server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Single-page application: React Router owns the URL space, so any path
    # that is not a real file must return index.html. Without this, a hard
    # refresh on /crisis or /survival returns 404 from nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets are immutable; index.html must never be cached or
    # clients keep loading a stale bundle after a redeploy.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript
                      application/json image/svg+xml;

    # Conservative security headers. No CSP here because the API origin is
    # deployment-specific; add one once the backend URL is fixed.
    add_header X-Content-Type-Options "nosniff"        always;
    add_header X-Frame-Options        "SAMEORIGIN"     always;
    add_header Referrer-Policy        "no-referrer-when-downgrade" always;
}
